name: Azure Static Web Apps CI/CD LIVE

on:
  workflow_dispatch:
    inputs:
      manual_ref:
        type: string
        description: The tag or hash that needs to be deployed
        required: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
        GA: ${{ vars.GA_ID_LIVE }}
        ROOT_URL: ${{ vars.ROOT_URL_LIVE }}
        SEARCH_URL: ${{ vars.SEARCH_URL_LIVE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
          ref: "${{ github.event.inputs.manual_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build
        run: npm ci && npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_MEADOW_084F3FA0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, app_location IS the build output directory and
          # output_location must be empty. See:
          # https://learn.microsoft.com/en-us/azure/static-web-apps/build-configuration
          app_location: "dist" # Built above by `npm run build`
          api_location: "" # Api source code path - optional
          output_location: "" # Must be empty when skip_app_build is true
          skip_app_build: true
          ###### End of Repository/Build Configurations ######
