name: Test

on:
  pull_request:
  push:
    branches: [master, develop, test]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  budget:
    name: Payload budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The header's whole value is that it is small and loads in one request.
      # That erodes a kilobyte at a time unless it fails the build.
      - run: npm run size

  browsers:
    name: Browser suites
    runs-on: ubuntu-latest
    # Visual baselines are generated in this image; running the suite anywhere
    # else produces false diffs from font rasterization alone.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      # In this image the job runs as root, but $HOME is /github/home, owned by
      # pwuser — and Firefox refuses to launch when it does not own $HOME.
      # This is Playwright's documented workaround.
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - run: npm run test:visual
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
